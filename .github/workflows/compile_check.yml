permissions:
  contents: read
name: Compile Check

on:
  push:
    branches-ignore: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug -x lint && exit 0
            echo "Build failed (attempt $i), retrying..."
            sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
